name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow only installs and builds.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run the JS actions on Node 24 (Node 20 runtime is being deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` = `astro check && astro build`, so this is the typecheck too.
      - name: Type-check and build with Astro
        run: pnpm build
