<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0e14"/>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#16202b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(90 96)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="none" stroke="#5eead4" stroke-width="3.5"/>
    <path d="M14 22l9 8-9 8" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="30" y1="40" x2="44" y2="40" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"/>
    <text x="76" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#e6edf3">AgentPack</text>
  </g>
  <text x="90" y="270" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="700" fill="#e6edf3">Package your agent setup once.</text>
  <text x="90" y="350" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="700" fill="#5eead4">Install it anywhere.</text>
  <g transform="translate(90 430)">
    <rect x="0" y="0" width="1020" height="72" rx="12" fill="#0c1118" stroke="#1e2a38" stroke-width="1.5"/>
    <text x="28" y="47" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#5eead4">$</text>
    <text x="56" y="47" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#e6edf3">agentpack install github:owner/repo@ref#subpath</text>
  </g>
  <text x="90" y="572" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#9fb0c0">Open source · MIT · git-native · the compiler + governance layer for agent config</text>
</svg>
